<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .contenedor {
    /* 1 Direccion ya sea horizontal o vertical*/
    /* display: flex;
    flex-direction: column; */
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    }

    .card{ 
    width: 80px;
    padding: 20px;
    margin: 10px;
    }
    .card-LARGO{
        grid-column: 3;
        grid-row: span 3;
        display: flex;
        flex-direction: column;
    }
</style>
<body>
    <div class="contenedor">
        <div class="card" style="background-color: beige;">Card 1</div>
        <div class="card" style="background-color: rgb(182, 188, 221);">Card 2</div>
        <div class="card-LARGO" style="background-color: lightblue;">Card 3</div>
        <div class="card" style="background-color: lightgreen;">Card 4</div>
        <div class="card" style="background-color: lightcoral;">Card 5</div>
        <div class="card" style="background-color: lightpink;">Card 6</div>
        <div class="card" style="background-color: lightgray;">Card 7</div>

    </div>
</body>
</html>
